<!DOCTYPE html>

<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boodschappen">
<meta name="theme-color" content="#2D6A4F">
<meta name="description" content="Samen boodschappen bijhouden">
<link rel="apple-touch-icon" id="apple-icon" href="">
<link rel="manifest" id="pwa-manifest">
<title>Boodschappen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F7F5F0; --surface: #FFFFFF; --border: #E8E4DC;
  --text: #1A1714; --text2: #6B6560; --text3: #A09A93;
  --accent: #2D6A4F; --accent-light: #E8F4ED;
  --danger: #C0392B; --danger-light: #FDECEA;
  --radius: 16px; --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(26,23,20,0.08);
  --shadow-lg: 0 8px 32px rgba(26,23,20,0.12);
}
html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; min-height: 100dvh; }
.screen { display: none; flex-direction: column; min-height: 100dvh; }
.screen.active { display: flex; }

#screen-name { justify-content: center; align-items: center; padding: 32px 24px; background: var(–surface); }
.name-card { width: 100%; max-width: 360px; text-align: center; }
.logo { font-family: ‘DM Serif Display’, serif; font-size: 40px; color: var(–accent); margin-bottom: 8px; }
.logo-sub { font-size: 14px; color: var(–text3); margin-bottom: 40px; font-weight: 300; }
.name-label { font-size: 13px; font-weight: 500; color: var(–text2); text-align: left; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.name-input { width: 100%; padding: 16px 18px; border: 2px solid var(–border); border-radius: var(–radius-sm); font-family: ‘DM Sans’, sans-serif; font-size: 18px; font-weight: 500; color: var(–text); background: var(–bg); outline: none; margin-bottom: 20px; -webkit-appearance: none; }
.name-input:focus { border-color: var(–accent); }
.btn-primary { width: 100%; padding: 16px; background: var(–accent); color: white; border: none; border-radius: var(–radius-sm); font-family: ‘DM Sans’, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-primary:active { opacity: 0.85; }

#screen-lists { background: var(–bg); }
.top-bar { background: var(–surface); padding: 16px 20px 14px; border-bottom: 1px solid var(–border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.top-bar-title { font-family: ‘DM Serif Display’, serif; font-size: 22px; color: var(–text); }
.user-chip { display: flex; align-items: center; gap: 7px; background: var(–accent-light); padding: 6px 12px 6px 6px; border-radius: 100px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.user-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; }
.user-name-label { font-size: 13px; font-weight: 600; color: var(–accent); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lists-content { flex: 1; padding: 20px 16px; overflow-y: auto; }
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.list-card { background: var(–surface); border-radius: var(–radius); padding: 18px 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; box-shadow: var(–shadow); cursor: pointer; -webkit-tap-highlight-color: transparent; border: 1px solid var(–border); animation: slideIn 0.22s ease; }
.list-card:active { opacity: 0.8; }
.list-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; background: var(–accent-light); }
.list-info { flex: 1; min-width: 0; }
.list-name { font-size: 16px; font-weight: 600; color: var(–text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-meta { font-size: 13px; color: var(–text3); }
.list-arrow { color: var(–text3); font-size: 20px; }
.fab { position: fixed; bottom: 28px; right: 20px; width: 58px; height: 58px; background: var(–accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(45,106,79,0.35); cursor: pointer; -webkit-tap-highlight-color: transparent; border: none; z-index: 20; }
.fab:active { transform: scale(0.92); }
.fab svg { width: 24px; height: 24px; stroke: white; stroke-width: 2.5; fill: none; }

#screen-list { background: var(–bg); }
.list-topbar { background: var(–surface); padding: 14px 16px; border-bottom: 1px solid var(–border); position: sticky; top: 0; z-index: 10; }
.list-topbar-row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.back-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(–bg); cursor: pointer; -webkit-tap-highlight-color: transparent; border: 1px solid var(–border); flex-shrink: 0; }
.back-btn svg { width: 18px; height: 18px; stroke: var(–text); stroke-width: 2; fill: none; }
.list-topbar-title { font-family: ‘DM Serif Display’, serif; font-size: 20px; color: var(–text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.add-row { display: flex; gap: 8px; align-items: center; }
.add-input { flex: 1; padding: 11px 14px; border: 2px solid var(–border); border-radius: var(–radius-sm); font-family: ‘DM Sans’, sans-serif; font-size: 16px; color: var(–text); background: var(–bg); outline: none; -webkit-appearance: none; }
.add-input:focus { border-color: var(–accent); }
.add-btn { width: 44px; height: 44px; background: var(–accent); border: none; border-radius: var(–radius-sm); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
.add-btn:active { opacity: 0.8; }
.add-btn svg { width: 20px; height: 20px; stroke: white; stroke-width: 2.5; fill: none; }
.items-list { flex: 1; padding: 16px; overflow-y: auto; padding-bottom: 90px; }
.item-row { background: var(–surface); border-radius: var(–radius-sm); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; border: 1px solid var(–border); animation: slideIn 0.2s ease; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.item-row.checked { opacity: 0.5; }
.checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(–border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.18s; }
.item-row.checked .checkbox { background: var(–accent); border-color: var(–accent); }
.checkbox svg { width: 13px; height: 13px; stroke: white; stroke-width: 3; fill: none; opacity: 0; transition: opacity 0.15s; }
.item-row.checked .checkbox svg { opacity: 1; }
.item-text-wrap { flex: 1; min-width: 0; }
.item-text { font-size: 16px; font-weight: 500; color: var(–text); }
.item-row.checked .item-text { text-decoration: line-through; color: var(–text3); }
.item-by { font-size: 12px; color: var(–text3); margin-top: 2px; }
.item-avatar { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white; flex-shrink: 0; }
.delete-item-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: transparent; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.delete-item-btn svg { width: 15px; height: 15px; stroke: var(–danger); stroke-width: 2; fill: none; }
.clear-checked-btn { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(–danger-light); color: var(–danger); border: none; border-radius: 100px; padding: 12px 22px; font-family: ‘DM Sans’, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; display: none; -webkit-tap-highlight-color: transparent; box-shadow: var(–shadow-lg); white-space: nowrap; }
.clear-checked-btn.visible { display: block; }
.empty-state { text-align: center; padding: 48px 24px; color: var(–text3); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; line-height: 1.5; }

.modal-overlay { position: fixed; inset: 0; background: rgba(26,23,20,0.5); z-index: 100; display: none; align-items: flex-end; backdrop-filter: blur(2px); }
.modal-overlay.open { display: flex; }
.modal-sheet { background: var(–surface); width: 100%; border-radius: 20px 20px 0 0; padding: 20px 20px 36px; animation: sheetUp 0.25s ease; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(–border); border-radius: 2px; margin: 0 auto 20px; }
.modal-title { font-family: ‘DM Serif Display’, serif; font-size: 20px; color: var(–text); margin-bottom: 16px; }
.modal-input { width: 100%; padding: 14px 16px; border: 2px solid var(–border); border-radius: var(–radius-sm); font-family: ‘DM Sans’, sans-serif; font-size: 17px; color: var(–text); background: var(–bg); outline: none; margin-bottom: 14px; -webkit-appearance: none; }
.modal-input:focus { border-color: var(–accent); }
.emoji-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.emoji-opt { width: 44px; height: 44px; border-radius: 10px; background: var(–bg); border: 2px solid var(–border); font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.emoji-opt.selected { border-color: var(–accent); background: var(–accent-light); }
.modal-btns { display: flex; gap: 10px; }
.btn-secondary { flex: 1; padding: 14px; background: var(–bg); color: var(–text2); border: 1px solid var(–border); border-radius: var(–radius-sm); font-family: ‘DM Sans’, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(–text); color: white; padding: 12px 20px; border-radius: 100px; font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.25s; z-index: 200; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

</head>
<body>

<div class="screen active" id="screen-name">
  <div class="name-card">
    <div class="logo">🛒 Boodschappen</div>
    <div class="logo-sub">Samen boodschappen doen</div>
    <div class="name-label">Jouw naam</div>
    <input class="name-input" id="name-input" type="text" placeholder="Bijv. Stefan" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="20">
    <button class="btn-primary" id="btn-save-name">Doorgaan</button>
  </div>
</div>

<div class="screen" id="screen-lists">
  <div class="top-bar">
    <div class="top-bar-title">Mijn lijstjes</div>
    <div class="user-chip" id="user-chip">
      <div class="user-avatar" id="header-avatar"></div>
      <span class="user-name-label" id="header-name"></span>
    </div>
  </div>
  <div class="lists-content" id="lists-content"></div>
  <button class="fab" id="fab-new-list">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</div>

<div class="screen" id="screen-list">
  <div class="list-topbar">
    <div class="list-topbar-row1">
      <div class="back-btn" id="back-btn">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <span class="list-topbar-title" id="list-detail-title"></span>
    </div>
    <div class="add-row">
      <input class="add-input" id="add-item-input" type="text" placeholder="Product toevoegen…" autocomplete="off" autocorrect="on" spellcheck="true">
      <button class="add-btn" id="add-btn">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="items-list" id="items-list"></div>
  <button class="clear-checked-btn" id="clear-checked-btn">Afgevinkte items verwijderen</button>
</div>

<div class="modal-overlay" id="modal-new-list">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Nieuwe lijst</div>
    <input class="modal-input" id="new-list-name" type="text" placeholder="Bijv. Albert Heijn" autocorrect="off">
    <div class="emoji-row" id="emoji-row"></div>
    <div class="modal-btns">
      <button class="btn-secondary" id="btn-cancel-list">Annuleer</button>
      <button class="btn-primary" style="flex:1.5" id="btn-create-list">Aanmaken</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var COLORS = ['#2D6A4F','#1A6B8A','#8B4513','#6B3FA0','#C0392B','#D4A853','#2C7873','#8E44AD'];
var EMOJIS = ['🛒','🥦','🍎','🥐','🥩','🧹','🏠','💊','🐾','🎉'];
var currentUser = {name:'',color:''};
var currentListId = null;
var selectedEmoji = '🛒';
var lists = {};
var items = {};

function save() {
  localStorage.setItem('bp_lists', JSON.stringify(lists));
  localStorage.setItem('bp_items', JSON.stringify(items));
}

function load() {
  try { lists = JSON.parse(localStorage.getItem('bp_lists') || '{}'); } catch(e) { lists = {}; }
  try { items = JSON.parse(localStorage.getItem('bp_items') || '{}'); } catch(e) { items = {}; }
}

function getColor(name) {
  var h = 0;
  for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + h * 31;
  return COLORS[Math.abs(h) % COLORS.length];
}

function initial(name) { return (name||'?').trim().slice(0,1).toUpperCase(); }

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0,0);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function init() {
  load();
  var stored = localStorage.getItem('bp_user');
  if (stored) {
    try {
      currentUser = JSON.parse(stored);
      currentUser.color = getColor(currentUser.name);
      renderUserChip();
      renderLists();
      showScreen('lists');
    } catch(e) { showScreen('name'); }
  } else {
    showScreen('name');
  }
}

function saveName() {
  var name = document.getElementById('name-input').value.trim();
  if (!name) return;
  currentUser = {name: name, color: getColor(name)};
  localStorage.setItem('bp_user', JSON.stringify({name: name}));
  renderUserChip();
  renderLists();
  showScreen('lists');
}

function renderUserChip() {
  var av = document.getElementById('header-avatar');
  av.textContent = initial(currentUser.name);
  av.style.background = currentUser.color;
  document.getElementById('header-name').textContent = currentUser.name;
}

function renderLists() {
  var container = document.getElementById('lists-content');
  var keys = Object.keys(lists);
  container.innerHTML = '';

  if (keys.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🛍️</div><div class="empty-text">Nog geen lijstjes. Tik op + om je eerste aan te maken.</div></div>';
    return;
  }

  keys.sort(function(a,b) { return (lists[a].ts||0)-(lists[b].ts||0); });
  keys.forEach(function(id) {
    var l = lists[id];
    var count = items[id] ? Object.keys(items[id]).length : 0;
    var card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML =
      '<div class="list-icon">'+(l.emoji||'🛒')+'</div>'+
      '<div class="list-info">'+
        '<div class="list-name">'+esc(l.name)+'</div>'+
        '<div class="list-meta">'+count+' '+(count===1?'product':'producten')+'</div>'+
      '</div>'+
      '<div class="list-arrow">›</div>';
    card.onclick = function() { openList(id); };
    container.appendChild(card);
  });
}

function openNewListModal() {
  selectedEmoji = '🛒';
  var row = document.getElementById('emoji-row');
  row.innerHTML = '';
  EMOJIS.forEach(function(e) {
    var el = document.createElement('div');
    el.className = 'emoji-opt'+(e===selectedEmoji?' selected':'');
    el.textContent = e;
    el.onclick = function() {
      selectedEmoji = e;
      row.querySelectorAll('.emoji-opt').forEach(function(o) { o.classList.remove('selected'); });
      el.classList.add('selected');
    };
    row.appendChild(el);
  });
  document.getElementById('new-list-name').value = '';
  document.getElementById('modal-new-list').classList.add('open');
  setTimeout(function() { document.getElementById('new-list-name').focus(); }, 200);
}

function closeNewListModal() {
  document.getElementById('modal-new-list').classList.remove('open');
}

function createList() {
  var name = document.getElementById('new-list-name').value.trim();
  if (!name) return;
  closeNewListModal();
  var id = 'list_'+Date.now();
  lists[id] = {id:id, name:name, emoji:selectedEmoji, ts:Date.now()};
  items[id] = {};
  save();
  renderLists();
}

function openList(listId) {
  currentListId = listId;
  var list = lists[listId];
  if (!list) return;
  document.getElementById('list-detail-title').textContent = (list.emoji||'')+' '+list.name;
  document.getElementById('add-item-input').value = '';
  renderItems();
  showScreen('list');
}

function renderItems() {
  var container = document.getElementById('items-list');
  var clearBtn = document.getElementById('clear-checked-btn');
  var itms = items[currentListId] || {};
  var keys = Object.keys(itms);
  container.innerHTML = '';

  if (keys.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">✍️</div><div class="empty-text">Nog niets op de lijst. Voeg je eerste product toe.</div></div>';
    clearBtn.classList.remove('visible');
    return;
  }

  var unchecked = keys.filter(function(k) { return !itms[k].checked; });
  var checked = keys.filter(function(k) { return itms[k].checked; });
  clearBtn.classList.toggle('visible', checked.length > 0);

  unchecked.concat(checked).forEach(function(id) {
    var item = itms[id];
    var row = document.createElement('div');
    row.className = 'item-row'+(item.checked?' checked':'');
    var color = getColor(item.by||'?');
    row.innerHTML =
      '<div class="checkbox"><svg viewBox="0 0 24 24"><polyline points="20 6 9 13 4 10"/></svg></div>'+
      '<div class="item-text-wrap">'+
        '<div class="item-text">'+esc(item.text)+'</div>'+
        '<div class="item-by">'+esc(item.by||'')+'</div>'+
      '</div>'+
      '<div class="item-avatar" style="background:'+color+'">'+initial(item.by||'?')+'</div>'+
      '<button class="delete-item-btn"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>';

    row.querySelector('.delete-item-btn').onclick = function(e) {
      e.stopPropagation();
      delete items[currentListId][id];
      save();
      renderItems();
      renderLists();
    };

    row.onclick = function(e) {
      if (e.target.closest('.delete-item-btn')) return;
      items[currentListId][id].checked = !items[currentListId][id].checked;
      save();
      renderItems();
    };

    container.appendChild(row);
  });
}

function addItem() {
  var input = document.getElementById('add-item-input');
  var text = input.value.trim();
  if (!text || !currentListId) return;
  input.value = '';
  input.focus();
  var id = 'item_'+Date.now();
  if (!items[currentListId]) items[currentListId] = {};
  items[currentListId][id] = {id:id, text:text, checked:false, by:currentUser.name, ts:Date.now()};
  save();
  renderItems();
  renderLists();
}

document.getElementById('btn-save-name').onclick = saveName;
document.getElementById('name-input').onkeydown = function(e) { if (e.key==='Enter') saveName(); };
document.getElementById('user-chip').onclick = function() {
  localStorage.removeItem('bp_user');
  document.getElementById('name-input').value = '';
  showScreen('name');
};
document.getElementById('fab-new-list').onclick = openNewListModal;
document.getElementById('btn-cancel-list').onclick = closeNewListModal;
document.getElementById('modal-new-list').onclick = function(e) { if (e.target===this) closeNewListModal(); };
document.getElementById('new-list-name').onkeydown = function(e) { if (e.key==='Enter') createList(); };
document.getElementById('btn-create-list').onclick = createList;
document.getElementById('add-btn').onclick = addItem;
document.getElementById('add-item-input').onkeydown = function(e) { if (e.key==='Enter') addItem(); };
document.getElementById('clear-checked-btn').onclick = function() {
  var itms = items[currentListId] || {};
  Object.keys(itms).forEach(function(id) { if (itms[id].checked) delete itms[id]; });
  save();
  renderItems();
  renderLists();
};
document.getElementById('back-btn').onclick = function() {
  currentListId = null;
  showScreen('lists');
};

init();

// ── APP ICOON genereren via canvas ────────────────────────
(function() {
  var c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  var ctx = c.getContext('2d');
  // Groene achtergrond met afgeronde hoeken
  ctx.fillStyle = '#2D6A4F';
  ctx.beginPath();
  ctx.roundRect(0, 0, 512, 512, 115);
  ctx.fill();
  // Winkelwagentje emoji
  ctx.font = '300px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🛒', 256, 270);
  var iconUrl = c.toDataURL('image/png');
  document.getElementById('apple-icon').href = iconUrl;
})();

// ── PWA MANIFEST (inline, geen extern bestand nodig) ─────
var manifest = {
  name: 'Boodschappen',

  description: 'Samen boodschappen bijhouden',
  start_url: './',
  display: 'standalone',
  background_color: '#F7F5F0',

// ── SERVICE WORKER (offline werking) ─────────────────────
if ('serviceWorker' in navigator) {
  var swCode = `
    var CACHE = 'boodschappen-v1';
    var ASSETS = [self.location.href];
    self.addEventListener('install', function(e) {
      e.waitUntil(caches.open(CACHE).then(function(c) { return c.addAll(ASSETS); }));
      self.skipWaiting();
    });
    self.addEventListener('activate', function(e) {
      e.waitUntil(caches.keys().then(function(keys) {
        return Promise.all(keys.filter(function(k) { return k !== CACHE; }).map(function(k) { return caches.delete(k); }));
      }));
      self.clients.claim();
    });
    self.addEventListener('fetch', function(e) {
      e.respondWith(caches.match(e.request).then(function(r) { return r || fetch(e.request); }));
    });
  `;
  var swBlob = new Blob([swCode], {type: 'application/javascript'});
  var swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(function() {});
}
</script>
